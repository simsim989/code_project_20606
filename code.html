<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자세교정 프로그램</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s, border-color 0.4s;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f111a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        body.good { background-color: #0b1613; }
        body.warning { background-color: #1a0b0b; }
        body.warning .blur-target { filter: blur(12px); transition: filter 0.3s; }

        .dashboard {
            width: 100%;
            max-width: 950px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 40%, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 1.1rem;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .camera-card {
            background: #020617;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #1e293b;
            position: relative;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .good .camera-card {
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .warning .camera-card {
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        .control-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
        }

        #status-banner {
            font-size: 1.3rem;
            font-weight: 700;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            background: #1e293b;
        }

        .good #status-banner {
            background: #10b981;
            color: #fff;
        }

        .warning #status-banner {
            background: #ef4444;
            color: #fff;
            animation: pulse 1s infinite alternate;
        }

        .metrics-container {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-row {
            margin-bottom: 14px;
        }

        .metric-row:last-child {
            margin-bottom: 0;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #94a3b8;
        }

        .track {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: #38bdf8;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .warning .fill-bad {
            background: #ef4444;
        }

        button {
            background: #fff;
            color: #0f111a;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        button:hover {
            background: #38bdf8;
            color: #fff;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
</head>
<body class="good">

    <div class="dashboard">
        <div class="header-zone">
            <div>
                <h1>자세 교정</h1>
                <p style="font-size: 0.85rem; color: #64748b; margin-top: 2px;">자세 트래커</p>
            </div>
            <div class="timer-box" id="focus-timer">Focus Time: 00:00</div>
        </div>

        <div class="main-layout">
            <div class="camera-card blur-target">
                <canvas id="canvas"></canvas>
            </div>

            <div class="control-card">
                <button id="start-btn" onclick="init()">프로그램 시작</button>
                <div id="status-banner">프로그램 정지 - 시작하세요</div>

                <div class="metrics-container">
                    <div class="metric-row">
                        <div class="metric-header">
                            <span>바른 자세 (Good)</span>
                            <span id="prob-good">0%</span>
                        </div>
                        <div class="track">
                            <div class="fill" id="bar-good" style="background:#10b981;"></div>
                        </div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-header">
                            <span>나쁜 자세 (Bad)</span>
                            <span id="prob-bad">0%</span>
                        </div>
                        <div class="track">
                            <div class="fill fill-bad" id="bar-bad"></div>
                        </div>
                    </div>
                </div>

                <div id="label-container" style="font-size:0.9rem; color:#94a3b8;"></div>
            </div>
        </div>
    </div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/PM0Fi7_PG/";
        let model, webcam, ctx, maxPredictions;
        let totalFocusSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        async function init() {
            if (isRunning) return;
            isRunning = true;

            const startBtn = document.getElementById("start-btn");
            const banner = document.getElementById("status-banner");

            banner.innerText = "로드 중...";
            startBtn.disabled = true;

            try {
                model = await tmPose.load(URL + "model.json", URL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                const size = 300;
                const flip = true;
                webcam = new tmPose.Webcam(size, size, flip);
                await webcam.setup();
                await webcam.play();

                const canvas = document.getElementById("canvas");
                canvas.width = size;
                canvas.height = size;
                ctx = canvas.getContext("2d");

                const labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }

                banner.innerText = "모니터링 실황 가동 중";
                startBtn.innerText = "시스템 작동 중";

                startTimer();
                window.requestAnimationFrame(loop);
            } catch (e) {
                console.error(e);
                banner.innerText = "로드 실패 (카메라 확인)";
                startBtn.disabled = false;
                isRunning = false;
            }
        }

        async function loop() {
            if (!webcam) return;
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let goodProb = 0;
            let badProb = 0;

            const labelContainer = document.getElementById("label-container");

            for (let i = 0; i < prediction.length; i++) {
                const className = prediction[i].className.trim().toLowerCase();
                const prob = prediction[i].probability;

                if (labelContainer.childNodes[i]) {
                    labelContainer.childNodes[i].innerHTML =
                        `${prediction[i].className}: ${(prob * 100).toFixed(1)}%`;
                }

                if (className === "good" || className.includes("good")) {
                    goodProb = prob;
                } else if (className === "bad" || className.includes("bad")) {
                    badProb = prob;
                }
            }

            if (goodProb === 0 && badProb === 0 && prediction.length >= 2) {
                goodProb = prediction[0].probability;
                badProb = prediction[1].probability;
            }

            const goodPercent = Math.round(goodProb * 100);
            const badPercent = Math.round(badProb * 100);

            document.getElementById("prob-good").innerText = goodPercent + "%";
            document.getElementById("bar-good").style.width = goodPercent + "%";
            document.getElementById("prob-bad").innerText = badPercent + "%";
            document.getElementById("bar-bad").style.width = badPercent + "%";

            if (badProb >= 0.7) {
                document.body.className = "warning";
                document.getElementById("status-banner").innerText = "경고: 고개를 드세요!";
            } else {
                document.body.className = "good";
                document.getElementById("status-banner").innerText = "정상: 바른 자세 유지 중";
            }

            drawPose(pose);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (document.body.className === "good") {
                    totalFocusSeconds++;
                    const mins = String(Math.floor(totalFocusSeconds / 60)).padStart(2, '0');
                    const secs = String(totalFocusSeconds % 60).padStart(2, '0');
                    document.getElementById("focus-timer").innerText = `Focus Time: ${mins}:${secs}`;
                }
            }, 1000);
        }

        function drawPose(pose) {
            if (webcam && webcam.canvas && ctx) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    ctx.strokeStyle = document.body.className === "good" ? "#10b981" : "#ef4444";
                    ctx.lineWidth = 4;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }
    </script>
</body>
</html>
